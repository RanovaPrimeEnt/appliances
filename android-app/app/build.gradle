plugins {
    id 'com.android.application'
}

def uploadKeystore = System.getenv("RANOVA_UPLOAD_KEYSTORE")

android {
    namespace 'com.ranova.marketplace'
    compileSdk 36

    defaultConfig {
        applicationId "com.ranova.marketplace"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
                storePassword System.getenv("RANOVA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RANOVA_KEY_ALIAS")
                keyPassword System.getenv("RANOVA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
