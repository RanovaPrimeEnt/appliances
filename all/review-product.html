<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review purchase · RANOVA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{background:#f7f8f6;color:#193b2e;margin:0;font:14px Inter,system-ui,Arial}main{max-width:610px;margin:24px auto;padding:0 16px 60px}.card{background:white;border:1px solid #e7ebe7;border-radius:18px;padding:22px;box-shadow:0 5px 20px #183b2a0a}h1{font-size:23px;margin:0 0 15px}.product{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid #eee}.product img{width:76px;height:76px;border-radius:10px;object-fit:contain;background:#f8faf8}.product b{font-size:15px}label{display:block;margin:18px 0 7px;font-weight:800}.stars{display:flex;gap:7px}.stars button{background:none;border:0;font-size:36px;color:#b9bdbb;padding:3px;cursor:pointer}.stars button.selected{color:#f2a21c}.stars button:focus-visible{outline:2px solid #f36b22}textarea,input[type=file]{width:100%;border:1px solid #dce4df;border-radius:10px;padding:12px;background:white}textarea{resize:vertical;min-height:115px;font:inherit}button.submit{background:#f36b22;border:0;border-radius:11px;color:white;padding:14px 20px;font-weight:850;margin-top:20px;width:100%;cursor:pointer}button:disabled{opacity:.5}#msg{padding-top:12px;line-height:1.5}a{color:#de641c}small{color:#6a746e;display:block;margin-top:6px}
</style></head><body><main><a href="./account.html">← Back to Me</a><div class="card" style="margin-top:15px"><h1>Review your purchase</h1><div class="product" id="product">Checking your completed purchase…</div><form id="form" hidden><label>How would you rate this product?</label><div class="stars" role="radiogroup" aria-label="Product rating"><button type="button" data-star="1" role="radio" aria-label="1 stars" aria-checked="false">☆</button><button type="button" data-star="2" role="radio" aria-label="2 stars" aria-checked="false">☆</button><button type="button" data-star="3" role="radio" aria-label="3 stars" aria-checked="false">☆</button><button type="button" data-star="4" role="radio" aria-label="4 stars" aria-checked="false">☆</button><button type="button" data-star="5" role="radio" aria-label="5 stars" aria-checked="false">☆</button></div><label for="comment">Your review (optional)</label><textarea id="comment" maxlength="2000" placeholder="Tell other customers about the product"></textarea><label for="photos">Add pictures (optional)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Up to 5 pictures, maximum 5 MB per picture. Reviews are moderated before publication.</small><button class="submit" id="submit">Submit review</button></form><div id="msg" role="status" aria-live="polite"></div></div></main><script>
(function(){
const sb=window.supabase.createClient("https://igaerssbzobutlwvjfwt.supabase.co","sb_publishable_NMzJFpXOIJMEH3LW50Cs9g_Otc6tlYr");
const params=new URLSearchParams(location.search),id=params.get("product"),orderId=params.get("order");
const el=x=>document.getElementById(x),msg=t=>el("msg").textContent=t;
let rating=0,user=null,product=null;
function eligibleItem(o){if(String(o.product_id||"")===id)return true;let v=o.items;let a=Array.isArray(v)?v:(v&&Array.isArray(v.items)?v.items:[]);return a.some(x=>String(x.product_id||x.productId||x.id||"")===id)}
async function start(){
 if(!/^[0-9a-f-]{36}$/i.test(id||"")||!/^[0-9a-f-]{36}$/i.test(orderId||"")){msg("Invalid product or order link.");return}
 const auth=await sb.auth.getUser();user=auth.data&&auth.data.user;if(!user){msg("Please sign in on Me to review this purchase.");return}
 const results=await Promise.all([sb.from("ranova_customer_orders").select("id,product_id,items,payment_status,status,buyer_user_id").eq("id",orderId).eq("buyer_user_id",user.id).maybeSingle(),sb.from("ranova_seller_products").select("id,name,primary_image_url,store_id").eq("id",id).maybeSingle(),sb.from("ranova_product_reviews").select("id,moderation_status").eq("product_id",id).eq("buyer_user_id",user.id).maybeSingle()]);
 if(results.some(x=>x.error)){msg("Unable to check your order at the moment.");return}
 const order=results[0].data;product=results[1].data;
 if(!order||!product||!eligibleItem(order)||!["paid","confirmed"].includes(String(order.payment_status).toLowerCase())||!["delivered","delivered_confirmed","completed"].includes(String(order.status).toLowerCase())){msg("This product can be reviewed after your purchase is paid and delivery is confirmed.");return}
 if(results[2].data){msg("You have already submitted a review for this product ("+results[2].data.moderation_status+").");return}
 el("product").textContent="";if(product.primary_image_url){let im=document.createElement("img");im.src=product.primary_image_url;im.alt="";el("product").appendChild(im)}let label=document.createElement("b");label.textContent=product.name;el("product").appendChild(label);el("form").hidden=false;
}
const stars=[...document.querySelectorAll("[data-star]")];function setRating(n){rating=n;stars.forEach(b=>{const active=Number(b.dataset.star)<=n;b.textContent=active?"★":"☆";b.classList.toggle("selected",active);b.setAttribute("aria-checked",String(Number(b.dataset.star)===n))})}
stars.forEach(b=>b.onclick=()=>setRating(Number(b.dataset.star)));
el("form").onsubmit=async e=>{e.preventDefault();if(!rating){msg("Please choose 1 to 5 stars.");return}
let files=[...el("photos").files];if(files.length>5||files.some(f=>f.size>5242880||!["image/jpeg","image/png","image/webp"].includes(f.type))){msg("Select up to 5 JPG, PNG or WebP photos of 5 MB or less.");return}
el("submit").disabled=true;msg("Submitting your review…");
try{let paths=[];for(let file of files){let ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg",path=user.id+"/"+crypto.randomUUID()+"."+ext;let up=await sb.storage.from("ranova-review-photos").upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;paths.push(path)}
let r=await sb.from("ranova_product_reviews").insert({product_id:id,store_id:product.store_id,buyer_user_id:user.id,rating:rating,review_text:el("comment").value.trim(),photo_paths:paths,moderation_status:"pending"});if(r.error)throw r.error;el("form").hidden=true;msg("Thank you! Your review was submitted and will appear after approval.");
}catch(err){msg(err.message||"Could not submit the review. Please try again.")}finally{el("submit").disabled=false}};
start();
})();
</script></body></html>
