<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RANOVA Seller Store</title>
<meta name="theme-color" content="#116a52">
<meta name="description" content="Shop products from a verified RANOVA marketplace seller.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}:root{--green:#103f34;--green2:#116a52;--orange:#ff5a2d;--ink:#15342e;--muted:#687a74;--line:#dfe8e4;--soft:#f5f8f6}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f7f9f8;color:var(--ink)}a{color:inherit}.wrap{width:min(1160px,calc(100% - 28px));margin:auto}
.top{background:var(--green);color:#fff}.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950}.top a{text-decoration:none;border:1px solid #ffffff35;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:850}
.hero{position:relative;background:linear-gradient(135deg,#eaf8f2,#fff9ed 56%,#f4efff);overflow:hidden}.banner{height:230px;background:linear-gradient(135deg,#dcefe8,#f4efff);overflow:hidden}.banner img{width:100%;height:100%;object-fit:cover}.store-head{position:relative;margin-top:-54px;padding-bottom:24px;display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:end}.logo{width:110px;height:110px;border-radius:24px;background:#fff;border:5px solid #fff;box-shadow:0 12px 30px rgba(11,70,53,.13);overflow:hidden;display:grid;place-items:center;font-weight:950;color:var(--green2)}.logo img{width:100%;height:100%;object-fit:contain}.store-copy{padding-bottom:4px}.verified{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e5f6ed;color:#0b6b46;font-size:8px;font-weight:950}.store-copy h1{margin:6px 0 5px;font-size:clamp(28px,5vw,45px);line-height:1}.store-copy p{margin:0;color:#60736c;font-size:11px;line-height:1.55}.contact{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.contact a{min-height:40px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid #d9e4df;display:inline-flex;align-items:center;text-decoration:none;font-size:9px;font-weight:900}.contact a.primary{background:var(--green2);color:#fff;border-color:var(--green2)}
.about{padding:16px 0 6px}.about-grid{display:grid;grid-template-columns:1.5fr .7fr .8fr;gap:12px}.info{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.info b{display:block;font-size:10px}.info span,.info p{display:block;margin:5px 0 0;color:var(--muted);font-size:9px;line-height:1.5}
.products{padding:30px 0 70px}.head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:15px}.head h2{margin:0;font-size:27px}.head p{margin:4px 0 0;color:var(--muted);font-size:10px}.search{width:min(320px,100%);height:42px;border:1px solid #d7e3de;border-radius:999px;background:#fff;padding:0 14px;outline:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.img{height:190px;background:#f4f7f5;display:grid;place-items:center;overflow:hidden}.img img{width:100%;height:100%;object-fit:contain}.copy{padding:13px;display:flex;flex-direction:column;flex:1}.copy small{color:#74857f;font-size:8px}.copy h3{margin:5px 0 6px;font-size:13px;line-height:1.3}.copy p{margin:0;color:var(--muted);font-size:9px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{padding:5px 7px;border-radius:999px;background:#eff7f3;color:#245a49;font-size:7px;font-weight:900}.price{margin-top:auto;padding-top:12px;font-weight:950;font-size:13px}.buy{margin-top:9px;min-height:39px;border:0;border-radius:11px;background:var(--orange);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:950}.empty{grid-column:1/-1;padding:38px;border:1px dashed #ccd9d4;border-radius:18px;text-align:center;background:#fff;color:#71827b;font-size:11px}
.footer{padding:28px 0;background:#103f34;color:#cadbd5;font-size:9px}.footer a{color:#fff}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.about-grid{grid-template-columns:1fr 1fr}.about-grid .info:first-child{grid-column:1/-1}.store-head{grid-template-columns:90px 1fr}.logo{width:90px;height:90px}.contact{grid-column:1/-1;justify-content:flex-start}}
@media(max-width:620px){.banner{height:165px}.store-head{margin-top:-40px;grid-template-columns:76px 1fr;gap:12px}.logo{width:76px;height:76px;border-radius:19px}.store-copy h1{font-size:27px}.contact a{flex:1;justify-content:center}.about-grid{grid-template-columns:1fr}.about-grid .info:first-child{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.search{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.img{height:145px}.copy{padding:10px}.copy h3{font-size:11px}.price{font-size:11px}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand">RANOVA MARKET</div><a href="./">Back to marketplace</a></div></div>
<div id="loading" class="wrap" style="padding:60px 0;text-align:center;color:#6b7d76">Loading seller store…</div>
<div id="page" style="display:none">
  <section class="hero">
    <div id="banner" class="banner"></div>
    <div class="wrap store-head">
      <div id="logo" class="logo">R</div>
      <div class="store-copy"><span class="verified">✓ VERIFIED RANOVA SELLER</span><h1 id="storeName">Seller store</h1><p id="tagline"></p></div>
      <div id="contact" class="contact"></div>
    </div>
  </section>
  <section class="about"><div class="wrap about-grid">
    <div class="info"><b>About this store</b><p id="description"></p></div>
    <div class="info"><b>Location</b><span id="location"></span><b style="margin-top:10px">Minimum order</b><span id="minimum"></span></div>
    <div class="info"><b>Fulfilment</b><span id="fulfilment"></span><b style="margin-top:10px">Returns</b><span id="returns"></span></div>
  </div></section>
  <section class="products"><div class="wrap"><div class="head"><div><h2>Products</h2><p>Published products from this verified seller.</p></div><input id="search" class="search" placeholder="Search this store"></div><div id="grid" class="grid"></div></div></section>
  <footer class="footer"><div class="wrap">RANOVA marketplace seller storefront • <a href="./">Browse the main marketplace</a></div></footer>
</div>
<script>
(function(){
"use strict";
var SUPABASE_URL="https://igaerssbzobutlwvjfwt.supabase.co";
var SUPABASE_KEY="sb_publishable_NMzJFpXOIJMEH3LW50Cs9g_Otc6tlYr";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),store=null,products=[];
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function phoneDigits(v){var d=String(v||"").replace(/\D/g,"");if(d.startsWith("0"))d="233"+d.slice(1);return d}
function money(v){return v==null?"Ask seller for price":"GHS "+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
  var q=el("search").value.trim().toLowerCase();
  var list=products.filter(function(p){return !q||[p.name,p.category,p.short_description,p.description,p.sku].join(" ").toLowerCase().includes(q)});
  el("grid").innerHTML=list.length?list.map(function(p){
    var contact=phoneDigits(store.public_phone),text=encodeURIComponent("Hello "+store.store_name+", I found "+p.name+" on RANOVA. Please confirm price, stock, MOQ and delivery details.");
    var href=contact?"https://wa.me/"+contact+"?text="+text:"mailto:"+encodeURIComponent(store.public_email||"")+"?subject="+encodeURIComponent("RANOVA product enquiry - "+p.name);
    return '<article class="product"><div class="img">'+(p.primary_image_url?'<img src="'+esc(p.primary_image_url)+'" alt="'+esc(p.name)+'" loading="lazy">':'')+'</div><div class="copy"><small>'+esc(p.category)+'</small><h3>'+esc(p.name)+'</h3><p>'+esc(p.short_description||p.description||"Contact the seller for product details.")+'</p><div class="meta"><span class="chip">MOQ '+esc(p.moq||1)+'</span><span class="chip">'+esc(String(p.stock_status||"confirm_on_enquiry").replace(/_/g," "))+'</span></div><div class="price">'+esc(money(p.price))+'</div><a class="buy" href="'+href+'" target="_blank" rel="noopener">Contact seller</a></div></article>'
  }).join(""):'<div class="empty">No matching published products in this store yet.</div>';
}
async function boot(){
  var slug=new URLSearchParams(location.search).get("store")||"";
  if(!slug){el("loading").textContent="Store link is incomplete.";return}
  var sr=await sb.from("ranova_seller_stores").select("*").eq("slug",slug).eq("store_status","active").maybeSingle();
  if(sr.error||!sr.data){el("loading").textContent="This RANOVA store is not available.";return}
  store=sr.data;
  var pr=await sb.from("ranova_seller_products").select("*").eq("store_id",store.id).eq("product_status","active").order("created_at",{ascending:false});
  products=pr.data||[];
  el("storeName").textContent=store.store_name;el("tagline").textContent=store.tagline||"Verified seller on RANOVA";
  el("description").textContent=store.description||"Contact this seller for business information.";
  el("location").textContent=store.business_location||"Confirm with seller";el("minimum").textContent=store.minimum_order_note||"Varies by product";
  el("fulfilment").textContent=store.fulfilment_summary||"Confirm with seller";el("returns").textContent=store.return_policy_summary||"Confirm applicable terms with seller before purchase.";
  if(store.logo_url)el("logo").innerHTML='<img src="'+esc(store.logo_url)+'" alt="'+esc(store.store_name)+' logo">';else el("logo").textContent=store.store_name.charAt(0).toUpperCase();
  if(store.banner_url)el("banner").innerHTML='<img src="'+esc(store.banner_url)+'" alt="">';
  var links=[];var ph=phoneDigits(store.public_phone);
  if(ph)links.push('<a class="primary" href="https://wa.me/'+ph+'" target="_blank" rel="noopener">WhatsApp seller</a>');
  if(store.public_phone)links.push('<a href="tel:'+esc(store.public_phone)+'">Call</a>');
  if(store.public_email)links.push('<a href="mailto:'+esc(store.public_email)+'">Email</a>');
  el("contact").innerHTML=links.join("");
  el("loading").style.display="none";el("page").style.display="block";render();
}
el("search").addEventListener("input",render);boot();
})();
</script>
</body>
</html>
