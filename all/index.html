<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranova Prime Enterprise</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#fff}#site{width:100%;height:100%;border:0;display:block}
.cam,.scan,.results{position:fixed;inset:0;z-index:9999;display:none}.show{display:flex!important}
.cam{background:#050806;color:#fff;flex-direction:column}.preview{position:relative;flex:1;min-height:0;background:#111;overflow:hidden}.preview video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;inset:18% 10% 20%;border:1px solid #ffffff55;border-radius:22px}.guide:after{content:"Place one product inside the frame";position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);white-space:nowrap;padding:7px 10px;border-radius:999px;background:#0008;font-size:11px}
.top{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}.top button{width:44px;height:44px;border:0;border-radius:50%;background:#0007;color:#fff;font-size:28px}.ready{padding:8px 12px;border-radius:999px;background:#0007;font-size:12px;font-weight:700}
.controls{min-height:145px;padding:18px 22px max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;background:#050806}.action{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:700}.action svg{width:27px;height:27px}.capture{width:78px;height:78px;margin:auto;border-radius:50%;border:5px solid #fff;background:#ffffff30;box-shadow:inset 0 0 0 4px #050806}.thumb{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff44;display:grid;place-items:center;background:#ffffff18}
.history{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;background:#050806fa;padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));box-sizing:border-box}.historyHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.historyHead button{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:23px}.historyList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:auto}.historyItem{padding:0;border:1px solid #ffffff22;border-radius:14px;background:#ffffff10;color:#fff;overflow:hidden;text-align:left}.historyItem img{width:100%;aspect-ratio:1.2/1;object-fit:cover}.historyItem span{display:block;padding:9px;font-size:11px}
.scan{align-items:center;justify-content:center;background:#04140fc7;backdrop-filter:blur(5px);padding:18px;box-sizing:border-box}.scanCard{width:min(92vw,420px);padding:13px;background:#fff;border-radius:22px}.scanWindow{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:16px;background:#edf3ef}.scanWindow img{width:100%;height:100%;object-fit:contain}.line{position:absolute;left:5%;right:5%;top:8%;height:3px;background:linear-gradient(90deg,transparent,#31e49d,#0e8f61,#31e49d,transparent);box-shadow:0 0 18px #31e49dcc;animation:sweep .85s ease-in-out infinite alternate}@keyframes sweep{to{top:91%}}.scanCopy{text-align:center;padding:14px 5px 5px}.scanCopy strong{display:block;color:#0a3f30;font-size:17px}.scanCopy span{display:block;margin-top:4px;color:#687771;font-size:12px}
.results{align-items:flex-end;justify-content:center;background:#02100b85;backdrop-filter:blur(3px)}.sheet{width:min(100%,720px);max-height:80vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px max(22px,env(safe-area-inset-bottom));box-sizing:border-box}.rhead{display:flex;justify-content:space-between;gap:12px}.rhead h3{margin:0;color:#103d31}.rhead p{margin:5px 0 14px;color:#687771;font-size:12px}.rhead button{width:38px;height:38px;border:0;border-radius:50%;background:#eef3f0;font-size:22px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:0;border:1px solid #dfe7e3;border-radius:14px;background:#fff;overflow:hidden;text-align:left}.card img{display:block;width:100%;height:120px;object-fit:contain;background:#f3f6f4}.card div{padding:9px}.card b{display:block;font-size:12px;color:#173d32}.card small{font-size:9px;color:#728078}.nomatch{grid-column:1/-1;padding:28px 10px;text-align:center;color:#687771;font-size:13px}
</style>
</head>
<body>
<iframe id="site" src="./site.html#products"></iframe>
<div id="cam" class="cam">
 <div class="top"><button id="closeCam">‹</button><span id="ready" class="ready">Preparing visual search…</span></div>
 <div class="preview"><video id="video" autoplay playsinline muted></video><div class="guide"></div></div>
 <div class="controls">
  <button id="historyBtn" class="action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
  <button id="capture" class="capture" aria-label="Take photo and scan"></button>
  <button id="galleryBtn" class="action"><span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>Gallery</span></button>
 </div>
 <div id="history" class="history"><div class="historyHead"><strong>Recent searches</strong><button id="closeHistory">×</button></div><div id="historyList" class="historyList"></div></div>
</div>
<div id="scan" class="scan"><div class="scanCard"><div class="scanWindow"><img id="scanImg"><div class="line"></div></div><div class="scanCopy"><strong id="scanTitle">Scanning product…</strong><span id="scanText">Comparing the photo with the catalogue.</span></div></div></div>
<div id="results" class="results"><div class="sheet"><div class="rhead"><div><h3 id="resultTitle">Closest catalogue matches</h3><p id="resultText">Tap a product to open it in the catalogue.</p></div><button id="closeResults">×</button></div><div id="cards" class="cards"></div></div></div>
<input id="gallery" type="file" accept="image/*" hidden>
<input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>
<script>
(function(){
"use strict";
var frame=document.getElementById("site"),cam=document.getElementById("cam"),video=document.getElementById("video"),ready=document.getElementById("ready"),history=document.getElementById("history"),historyList=document.getElementById("historyList"),scan=document.getElementById("scan"),scanImg=document.getElementById("scanImg"),scanTitle=document.getElementById("scanTitle"),scanText=document.getElementById("scanText"),results=document.getElementById("results"),cards=document.getElementById("cards"),resultTitle=document.getElementById("resultTitle"),resultText=document.getElementById("resultText"),gallery=document.getElementById("gallery"),cameraFile=document.getElementById("cameraFile");
var stream=null,modelPromise=null,indexPromise=null,productIndex=[];
var CACHE="rpe_visual_index_v3",HISTORY="rpe_visual_history_v3";
function doc(){return frame.contentDocument||frame.contentWindow.document}
function products(){try{return frame.contentWindow.PRODUCTS||[]}catch(e){return[]}}
function loadScript(src){return new Promise(function(ok,bad){var x=document.querySelector('script[data-src="'+src+'"]');if(x){if(x.dataset.loaded==="1")return ok();x.addEventListener("load",ok,{once:true});return}x=document.createElement("script");x.src=src;x.async=true;x.dataset.src=src;x.onload=function(){x.dataset.loaded="1";ok()};x.onerror=bad;document.head.appendChild(x)})}
async function model(){if(!modelPromise)modelPromise=(async function(){await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");try{await window.tf.setBackend("webgl")}catch(e){}await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js");return window.mobilenet.load({version:2,alpha:0.5})})();return modelPromise}
function norm(a){var n=0,i;for(i=0;i<a.length;i++)n+=a[i]*a[i];n=Math.sqrt(n)||1;var o=new Float32Array(a.length);for(i=0;i<a.length;i++)o[i]=a[i]/n;return o}
function dot(a,b){var n=Math.min(a.length,b.length),s=0,i;for(i=0;i<n;i++)s+=a[i]*b[i];return s}
function image(src){return new Promise(function(ok,bad){var i=new Image();i.onload=function(){ok(i)};i.onerror=bad;i.src=src})}
async function embed(i){var m=await model(),t=m.infer(i,true),a=norm(await t.data());t.dispose();return a}
function productSignature(){return products().map(function(p){return p.id+":"+p.name}).join("|")}
async function buildIndex(){var ps=products();if(!ps.length)throw Error("Catalogue not ready");var sig=productSignature();try{var saved=JSON.parse(localStorage.getItem(CACHE)||"null");if(saved&&saved.sig===sig&&saved.items&&saved.items.length===ps.length){productIndex=saved.items.map(function(x){return{id:x.id,vec:Float32Array.from(x.vec)}});ready.textContent="Visual search ready";return productIndex}}catch(e){}
ready.textContent="Preparing product matcher…";await model();var out=[];for(var i=0;i<ps.length;i++){ready.textContent="Preparing "+(i+1)+"/"+ps.length+" products…";out.push({id:ps[i].id,vec:await embed(await image(ps[i].image))});await new Promise(function(r){setTimeout(r,0)})}productIndex=out;try{localStorage.setItem(CACHE,JSON.stringify({sig:sig,items:out.map(function(x){return{id:x.id,vec:Array.from(x.vec)}})}))}catch(e){}ready.textContent="Visual search ready";return out}
function startIndex(){if(!indexPromise)indexPromise=buildIndex().catch(function(e){ready.textContent="Visual search loads when needed";throw e});return indexPromise}
function inject(){var d=doc();if(!d||d.getElementById("rpe-test"))return;var s=d.createElement("style");s.id="rpe-test";s.textContent='html,body,button,input{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important}@media(max-width:620px){.category-cards{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.category-card,.category-card:last-child{grid-column:auto!important}.category-image{height:125px!important}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.product-img{height:145px!important}.product-info{padding:11px!important}.product h3{font-size:13px!important}.product p{font-size:11px!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}.product-actions{grid-template-columns:minmax(0,1fr) auto!important;gap:5px!important}.select-btn,.enquire-btn{font-size:10px!important;padding:8px 6px!important}}.search.rpe{display:flex!important;align-items:center!important;min-width:0!important;width:min(100%,720px)!important;padding:4px!important;border:2px solid #163e32!important}.search.rpe>span{display:none}.search.rpe input{flex:1;min-width:0;padding:10px 6px!important}.rpeBtn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#52665f;display:grid;place-items:center}.rpeBtn svg{width:21px;height:21px}.rpeGo{height:40px;border:0;border-radius:999px;background:#0e5b43;color:#fff;padding:0 15px;font-weight:700}';d.head.appendChild(s);var label=d.querySelector("label.search"),input=d.getElementById("search");if(!label||!input)return;label.classList.add("rpe");var scanBtn=d.createElement("button");scanBtn.type="button";scanBtn.className="rpeBtn";scanBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';var gal=d.createElement("button");gal.type="button";gal.className="rpeBtn";gal.setAttribute("aria-label","Camera");gal.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h3l1.5-2h5L16 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.2"/></svg>';var go=d.createElement("button");go.type="button";go.className="rpeGo";go.textContent="Search";label.insertBefore(scanBtn,input);label.appendChild(gal);label.appendChild(go);scanBtn.addEventListener("click",openCam);gal.addEventListener("click",function(){gallery.click()});go.addEventListener("click",function(){saveTextHistory(input.value);input.dispatchEvent(new Event("input",{bubbles:true}));d.getElementById("grid").scrollIntoView({behavior:"smooth"})});input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();saveTextHistory(input.value);input.dispatchEvent(new Event("input",{bubbles:true}));d.getElementById("grid").scrollIntoView({behavior:"smooth"})}})}
frame.addEventListener("load",function(){inject();var warm=function(){startIndex().catch(function(){})};if("requestIdleCallback" in window)requestIdleCallback(warm,{timeout:1800});else setTimeout(warm,1200)});
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}video.srcObject=null}
async function openCam(){cam.classList.add("show");history.classList.remove("show");ready.textContent=productIndex.length?"Visual search ready":"Preparing visual search…";try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error("Camera API unavailable");stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;await video.play()}catch(e){ready.textContent="Camera unavailable — tap the middle button to take a photo"}}
function closeCam(){stopCam();cam.classList.remove("show");history.classList.remove("show")}
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY)||"[]")}catch(e){return[]}}
function saveHistory(thumb,ids,label){var a=getHistory().filter(function(x){return !(x.kind==="visual"&&x.label===label)});a.unshift({kind:"visual",thumb:thumb,ids:ids,label:label});try{localStorage.setItem(HISTORY,JSON.stringify(a.slice(0,10)))}catch(e){}}
function saveTextHistory(term){term=(term||"").trim();if(!term)return;var a=getHistory().filter(function(x){return !(x.kind==="text"&&x.label.toLowerCase()===term.toLowerCase())});a.unshift({kind:"text",thumb:"",ids:[],label:term});try{localStorage.setItem(HISTORY,JSON.stringify(a.slice(0,10)))}catch(e){}}
function thumb(i){try{var c=document.createElement("canvas"),z=120;c.width=z;c.height=z;var x=c.getContext("2d"),sw=i.naturalWidth||z,sh=i.naturalHeight||z,k=Math.max(z/sw,z/sh);x.drawImage(i,(z-sw*k)/2,(z-sh*k)/2,sw*k,sh*k);return c.toDataURL("image/jpeg",.55)}catch(e){return""}}
function showHistory(){var a=getHistory();historyList.innerHTML="";if(!a.length){historyList.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#aaa;padding:30px">Your recent product searches will appear here.</div>';return}a.forEach(function(x){var b=document.createElement("button");b.className="historyItem";b.innerHTML=(x.thumb?'<img src="'+x.thumb+'">':'<div style="height:90px;display:grid;place-items:center;background:#ffffff0c;font-size:26px">⌕</div>')+'<span>'+x.label+"</span>";b.onclick=function(){closeCam();if(x.kind==="text"){var d=doc(),i=d.getElementById("search");i.value=x.label;i.dispatchEvent(new Event("input",{bubbles:true}));d.getElementById("grid").scrollIntoView({behavior:"smooth",block:"start"})}else{showMatches((x.ids||[]).map(function(id){return{id:id}}),false,x.label)}};historyList.appendChild(b)})}
function openProduct(p){var d=doc(),i=d.getElementById("search");i.value=p.name;i.dispatchEvent(new Event("input",{bubbles:true}));results.classList.remove("show");d.getElementById("grid").scrollIntoView({behavior:"smooth",block:"start"})}
function showMatches(a,scored,label){var ps=products();cards.innerHTML="";if(!a.length){resultTitle.textContent="No confident match";resultText.textContent="Try another angle or a clearer gallery photo.";cards.innerHTML='<div class="nomatch">No close catalogue match was found.</div>';results.classList.add("show");return}resultTitle.textContent=label||"Closest catalogue matches";resultText.textContent="These products are listed in the Ranova catalogue. Tap one to view it.";a.forEach(function(x){var p=ps.find(function(q){return q.id===x.id});if(!p)return;var b=document.createElement("button");b.className="card";b.innerHTML='<img src="'+p.image+'" alt=""><div><b>'+p.name+'</b><small>'+p.category+'</small></div>';b.onclick=function(){openProduct(p)};cards.appendChild(b)});results.classList.add("show")}
async function processBlob(blob){if(!blob)return;closeCam();var u=URL.createObjectURL(blob);scanImg.src=u;scanTitle.textContent="Preparing image…";scanText.textContent="Getting the photo ready.";scan.classList.add("show");var im=await image(u),th=thumb(im);try{scanTitle.textContent="Preparing matcher…";scanText.textContent="Loading catalogue comparison data.";await startIndex();scanTitle.textContent="Scanning product…";scanText.textContent="Comparing the photo directly with Ranova product images.";var q=await embed(im);scanTitle.textContent="Checking catalogue…";var ranked=productIndex.map(function(x){return{id:x.id,score:dot(q,x.vec)}}).sort(function(a,b){return b.score-a.score}).slice(0,4);scan.classList.remove("show");var good=ranked.length&&ranked[0].score>=.43?ranked:[];showMatches(good,true);if(good.length){var p=products().find(function(x){return x.id===good[0].id});saveHistory(th,good.map(function(x){return x.id}),p?p.name:"Visual search")}}catch(e){scan.classList.remove("show");showMatches([],false)}setTimeout(function(){URL.revokeObjectURL(u)},30000)}
document.getElementById("closeCam").onclick=closeCam;document.getElementById("historyBtn").onclick=function(){showHistory();history.classList.add("show")};document.getElementById("closeHistory").onclick=function(){history.classList.remove("show")};document.getElementById("galleryBtn").onclick=function(){gallery.click()};document.getElementById("closeResults").onclick=function(){results.classList.remove("show")};
gallery.onchange=function(){var f=gallery.files&&gallery.files[0];gallery.value="";if(f)processBlob(f)};cameraFile.onchange=function(){var f=cameraFile.files&&cameraFile.files[0];cameraFile.value="";if(f)processBlob(f)};
document.getElementById("capture").onclick=function(){if(video.videoWidth&&video.videoHeight){var max=1280,k=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight)),c=document.createElement("canvas");c.width=Math.round(video.videoWidth*k);c.height=Math.round(video.videoHeight*k);c.getContext("2d").drawImage(video,0,0,c.width,c.height);c.toBlob(function(b){if(b)processBlob(b)},"image/jpeg",.84)}else cameraFile.click()};
})();
</script>
</body>
</html>
