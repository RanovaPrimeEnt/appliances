name: Validate RANOVA Android Store Build
on:
  push:
    branches: [main, ranova-store-ready-mobile]
    paths: ["android-app/**", ".github/workflows/build-ranova-android-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Decode Play upload keystore when configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ranova-upload.jks"
      - name: Build Android App Bundle
        env:
          RANOVA_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/ranova-upload.jks', runner.temp) || '' }}
          RANOVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RANOVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RANOVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-app :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RANOVA-Play-Store-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
