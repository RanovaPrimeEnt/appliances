name: Build Ranova APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [feature/customer-seller-aab]
    paths:
      - 'android-app/**'
      - '.github/workflows/ranova-aab.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RANOVA_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RANOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RANOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RANOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RANOVA_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. A Play-ready AAB requires all four."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ranova-upload.jks"
          test -s "$RUNNER_TEMP/ranova-upload.jks"
          chmod 600 "$RUNNER_TEMP/ranova-upload.jks"
          echo "RANOVA_UPLOAD_KEYSTORE=$RUNNER_TEMP/ranova-upload.jks" >> "$GITHUB_ENV"
      - name: Verify upload keystore
        env:
          RANOVA_KEYSTORE_PASSWORD: ${{ secrets.RANOVA_KEYSTORE_PASSWORD }}
          RANOVA_KEY_ALIAS: ${{ secrets.RANOVA_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RANOVA_UPLOAD_KEYSTORE" -storepass:env RANOVA_KEYSTORE_PASSWORD -alias "$RANOVA_KEY_ALIAS" > /dev/null
      - name: Build APK and signed AAB
        env:
          RANOVA_KEYSTORE_PASSWORD: ${{ secrets.RANOVA_KEYSTORE_PASSWORD }}
          RANOVA_KEY_ALIAS: ${{ secrets.RANOVA_KEY_ALIAS }}
          RANOVA_KEY_PASSWORD: ${{ secrets.RANOVA_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Verify signed release bundle
        run: |
          set -euo pipefail
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          # AABs use JAR signing. -strict treats ordinary self-signed certificate
          # warnings as exit code 4, even when the signature itself verifies.
          jarsigner -verify -verbose -certs "$bundle" | tee "$RUNNER_TEMP/ranova-aab-verification.log"
          if ! grep -Eq '^jar verified\.' "$RUNNER_TEMP/ranova-aab-verification.log"; then
            echo "::error::The release AAB did not pass JAR signature verification."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ranova-test-apk
          if-no-files-found: error
          path: android-app/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ranova-play-aab
          if-no-files-found: error
          path: android-app/app/build/outputs/bundle/release/*.aab
