name: Android Customer and Seller AABs

on:
  workflow_dispatch:
  push:
    branches: [feature/customer-seller-aab]
    paths:
      - 'android-app/**'
      - '.github/workflows/ranova-aab.yml'

jobs:
  bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key
        env:
          HAS_KEYSTORE: ${{ secrets.RANOVA_KEYSTORE_BASE64 != '' }}
          KEYSTORE_B64: ${{ secrets.RANOVA_KEYSTORE_BASE64 }}
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ranova-upload.jks"
          echo "RANOVA_UPLOAD_KEYSTORE=$RUNNER_TEMP/ranova-upload.jks" >> "$GITHUB_ENV"
      - name: Build both bundles
        env:
          HAS_KEYSTORE: ${{ secrets.RANOVA_KEYSTORE_BASE64 != '' }}
          RANOVA_KEYSTORE_PASSWORD: ${{ secrets.RANOVA_KEYSTORE_PASSWORD }}
          RANOVA_KEY_ALIAS: ${{ secrets.RANOVA_KEY_ALIAS }}
          RANOVA_KEY_PASSWORD: ${{ secrets.RANOVA_KEY_PASSWORD }}
        run: gradle :app:bundleCustomerRelease :app:bundleSellerRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ranova-customer-seller-aab
          path: |
            android-app/app/build/outputs/bundle/customerRelease/*.aab
            android-app/app/build/outputs/bundle/sellerRelease/*.aab
