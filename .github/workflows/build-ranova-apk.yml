name: Build RANOVA Android APK

on:
  push:
    branches:
      - main
      - ranova-mobile-v1
    paths:
      - "android-app/**"
      - "rpe-v2/customer-1957.svg"\n      - "rpe-v2/customer-pwa.js"
      - ".github/workflows/build-ranova-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create high-resolution launcher icon
        run: |
          python -m pip install --quiet cairosvg
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="rpe-v2/customer-1957.svg",
              write_to="android-app/app/src/main/res/drawable-nodpi/ranova_customer.png",
              output_width=512,
              output_height=512
          )
          PY

      - name: Build debug APK
        run: |
          gradle -p android-app :app:assembleDebug --no-daemon
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/RANOVA-v1-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RANOVA-v1-Android-test
          path: android-app/app/build/outputs/apk/debug/RANOVA-v1-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable APK from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ranova-android-latest
          name: RANOVA Android
          body: Latest downloadable Android test build of the RANOVA customer app.
          prerelease: false
          make_latest: true
          files: android-app/app/build/outputs/apk/debug/RANOVA-v1-test.apk
          overwrite_files: true
